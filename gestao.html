<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor Tech 3.0 — Gestão</title><style>body{font:16px system-ui;background:#101c30;color:#edf5ff;max-width:1100px;margin:auto;padding:20px}section{border:1px solid #456582;border-radius:12px;padding:16px;margin:16px 0}input,select,textarea,button{box-sizing:border-box;padding:10px;margin:5px;border-radius:6px;max-width:100%}button{background:#1676b5;color:white;border:0}a{color:#8bd4ff}pre{white-space:pre-wrap;overflow-wrap:anywhere}article{border-top:1px solid #456582;padding:8px}label{display:block}</style><h1>Doctor Tech 3.0 — Gestão</h1><a href="/admin">Painel principal</a><p>Registros internos; não criam pagamentos ou ativam produtos.</p><section><h2>CRM</h2><form id="crm"><label>Empresa<input name="company" type="text" required></label><label>E-mail<input name="email" type="email" required></label><label>Observações<input name="notes" type="text" required></label><button>Registrar</button></form><div id="crmlist"></div></section><section><h2>Comparador de fornecedores</h2><p>Use SKU e condições equivalentes. Valores em centavos; cotação não homologada não autoriza venda.</p><form id="quotes"><label>Fornecedor<select name="supplier_id" required></select></label><label>SKU<input name="sku" required></label><label>Custo (centavos)<input name="cost_cents" type="number" min="1" required></label><label>Frete (centavos)<input name="freight_cents" type="number" min="0" required></label><label>Extras (centavos)<input name="extra_cents" type="number" min="0" required></label><label>Validade<input name="valid_until" type="date" required></label><label>Evidência<input name="evidence" required></label><button>Registrar cotação</button></form><div id="quoteslist"></div></section><section><h2>Financeiro interno</h2><form id="ledger"><select name="direction"><option value="income">Receita</option><option value="expense">Despesa</option></select><label>Valor (centavos)<input name="amount_cents" type="number" min="1" required></label><label>Descrição<input name="description" required></label><label>Vencimento<input name="due_date" type="date" required></label><button>Registrar previsão</button></form><div id="finance"></div><div id="ledgerlist"></div></section><section><h2>Atendimento</h2><div id="ticketslist"></div></section><section><h2>Auditoria de gestão</h2><div id="auditlist"></div></section><p id="msg" role="status"></p><script>const el=x=>document.getElementById(x),api=async(p,m='GET',b)=>{const r=await fetch('/admin/api/dt3/'+p,{method:m,headers:{'Content-Type':'application/json'},...(b?{body:JSON.stringify(b)}:{})});if(!r.ok)throw Error('HTTP '+r.status);return r.status===200&&m==='PATCH'?null:r.json()};const br=n=>(Number(n)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});async function load(){const d=await api('overview');const s=el('quotes').elements.supplier_id;s.replaceChildren(...d.suppliers.map(x=>new Option(x.name+(x.active?'':' (pendente)'),x.id)));const states={crm:['new','contacted','negotiating','won','lost'],ledger:['planned','settled','cancelled'],tickets:['open','reviewing','closed']};for(const k of ['crm','quotes','ledger','tickets','audit']){const l=el(k+'list');l.replaceChildren();let rows=d[k];if(k==='quotes')rows=rows.slice().sort((a,b)=>a.sku.localeCompare(b.sku)||(a.cost_cents+a.freight_cents+a.extra_cents)-(b.cost_cents+b.freight_cents+b.extra_cents));for(const x of rows){const a=document.createElement('article'),p=document.createElement('pre');p.textContent=k==='quotes'?[x.sku,d.suppliers.find(s=>String(s.id)===String(x.supplier_id))?.name||x.supplier_id,br(x.cost_cents+x.freight_cents+x.extra_cents),'Validade: '+x.valid_until,x.evidence].join('\n'):Object.entries(x).map(([k,v])=>k+': '+v).join('\n');a.append(p);if(states[k]){const s=document.createElement('select');for(const v of states[k])s.add(new Option(v,v));s.value=x.stage||x.state||x.status;const t=document.createElement('textarea');t.value=x.reply||'';if(k==='tickets')a.append(t);const b=document.createElement('button');b.textContent='Atualizar';b.onclick=async()=>{try{await api(k+'/'+x.id,'PATCH',{state:s.value,reply:t.value});await load()}catch(e){el('msg').textContent=e.message}};a.append(s,b)}l.append(a)}}el('finance').textContent=d.finance.map(x=>x.direction+' / '+x.state+': '+br(x.cents)).join(' | ')}for(const k of ['crm','quotes','ledger'])el(k).onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));for(const n of Object.keys(b))if(n.endsWith('_cents'))b[n]=Number(b[n]);try{await api(k,'POST',b);e.target.reset();await load();el('msg').textContent='Registro salvo'}catch(e){el('msg').textContent=e.message}};load().catch(e=>el('msg').textContent='Entre no painel administrativo. '+e.message);</script></html>
