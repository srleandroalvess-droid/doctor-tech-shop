<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal do provedor — Doctor Tech</title><style>body{font:16px system-ui;background:#101c30;color:#edf5ff;max-width:1100px;margin:auto;padding:20px}section{border:1px solid #456582;border-radius:12px;padding:16px;margin:16px 0}input,select,textarea,button{box-sizing:border-box;padding:10px;margin:5px;border-radius:6px;max-width:100%}button{background:#1676b5;color:white;border:0}a{color:#8bd4ff}pre{white-space:pre-wrap;overflow-wrap:anywhere}article{border-top:1px solid #456582;padding:8px}label{display:block}</style><h1>Portal do provedor — Doctor Tech</h1><a href="/conta">Minha conta</a> · <a href="/empresas">Solicitar orçamento</a> · <a href="/conta/pedidos">Meus pedidos</a><section><h2>Central de atendimento</h2><form id="f"><label>Assunto<input name="subject" required maxlength="150"></label><label>Mensagem<textarea name="message" required minlength="10" maxlength="3000"></textarea></label><button>Abrir chamado</button></form><div id="list"></div></section><p id="msg" role="status"></p><script>const el=x=>document.getElementById(x);async function load(){const r=await fetch('/conta/api/dt3/tickets');if(!r.ok)throw Error('Entre na sua conta para acessar os chamados.');const d=await r.json();el('list').replaceChildren();for(const x of d.tickets){const p=document.createElement('pre');p.textContent=[x.reference,x.subject,x.message,x.status,x.reply].join('\n');el('list').append(p)}}el('f').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/conta/api/dt3/tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(!r.ok)throw Error('Não foi possível abrir o chamado.');e.target.reset();await load();el('msg').textContent='Chamado registrado'}catch(e){el('msg').textContent=e.message}};load().catch(e=>el('msg').textContent=e.message);</script></html>
